CONFIG_VIDEO=y

# Zephyr's VENC driver, for the functions that jpeg_venc.c's encoder library uses
# to reach the hardware. It is only available along with its H.264 encoder.
CONFIG_VIDEO_ENCODER_H264=y

# CONFIG_VIDEO_CAPTURE_NUM_BUFS capture buffers plus
# CONFIG_VIDEO_CAPTURE_NUM_JPEG_BUFS JPEG buffers.
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=68

# Turn the CPU caches on.
CONFIG_CACHE_MANAGEMENT=y

# The VENC needs 8 byte aligned addresses, and the camera's DMA works in bursts.
CONFIG_VIDEO_BUFFER_POOL_ALIGN=64

# The FAT file system on the microSD card, which must already be formatted.
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# Zephyr's default is to erase and reformat a card that fails to mount.
CONFIG_FS_FATFS_MOUNT_MKFS=n

# FatFs's sector buffer goes through the SD card's DMA, so match its alignment.
CONFIG_FS_FATFS_WINDOW_ALIGNMENT=64

CONFIG_MAIN_STACK_SIZE=4096

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
